name: Check employer list

# Run this from the Actions tab whenever you edit employers.yaml.
# It tells you which employers resolve and which need fixing, without you
# needing Python installed anywhere. Read the results in the run log.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Verify every employer resolves
        env:
          USAJOBS_KEY: ${{ secrets.USAJOBS_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        # continue-on-error so the log stays readable even when entries fail —
        # a red X here is information, not a problem with the repo.
        continue-on-error: true
        run: python scripts/verify.py

      - name: What to do next
        run: |
          echo "Open the 'Verify every employer resolves' step above."
          echo "OK lines are working. BROKEN lines print how to fix them."
          echo "Edit employers.yaml in the browser, then run this again."
