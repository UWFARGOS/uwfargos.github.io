  # --- Federal ------------------------------------------------------------
  # One entry pulls every federal accounting and finance posting on the
  # student/recent-graduate hiring paths. Series 0510 accounting, 0511
  # auditing, 0501 financial admin, 1160 financial analysis.
  - name: Federal — Florida
    kind: government
    source: usajobs
    series: "0510;0511;0501;1160"
    location: Florida

  - name: Federal — nationwide student paths
    kind: government
    source: usajobs
    series: "0510;0511;0501;1160"
    location: ""

  # =====================================================================
  # INVESTMENT BANKING
  # =====================================================================
  # The bulge brackets have no public feed. These are manual entries: they
  # show on the board as programs with a link out, not as live req counts.
  # Verify each URL once, then they need touching maybe twice a year.
  #
  # Cycle timing is the real value here — these windows close in weeks, so a
  # student who knows "opens December" beats one refreshing a job board.

  - name: Goldman Sachs
    kind: bank
    source: manual
    url: https://www.goldmansachs.com/careers/students
    roles:
      - title: Summer Analyst Programme
        level: Internship
        bucket: Investment Banking & Markets
        location: New York, NY
        cycle: "Opens ~Mar-Jun for the following summer"
        note: Penultimate-year students. Divisions include IBD, Global Markets, Asset Management.

  - name: Morgan Stanley
    kind: bank
    source: manual
    url: https://www.morganstanley.com/careers/students-graduates
    roles:
      - title: Summer Analyst Program
        level: Internship
        bucket: Investment Banking & Markets
        location: New York, NY
        cycle: "Opens ~Dec-Jan, closes fast"
        note: Penultimate-year students. Also runs a sophomore Early Insights program.

  - name: JPMorganChase
    kind: bank
    source: manual
    url: https://careers.jpmorgan.com/us/en/students
    roles:
      - title: Summer Analyst Program
        level: Internship
        bucket: Investment Banking & Markets
        location: New York, NY
        cycle: "Opens ~Dec-Jan"
        note: Also runs Advancing Black Pathways and Winning Women sophomore programs.

  # Citi turned up on Workday at wd5. Run Check employer list once to confirm;
  # if it fails, comment this out and uncomment the manual entry below it.
  - name: Citi
    kind: bank
    source: workday
    careers_url: https://citi.wd5.myworkdayjobs.com/en-US/2
    search: [intern, internship, campus, graduate, analyst]

  # - name: Citi
