  - name: Bank of America
    kind: bank
    source: manual
    url: https://campus.bankofamerica.com
    roles:
      - title: Global Markets / Investment Banking Analyst Program
        level: Internship
        bucket: Investment Banking & Markets
        location: Charlotte, NC
        cycle: "Opens ~Dec-Jan"
        note: Charlotte presence makes this more reachable for Southeast students.

  # --- Middle market and regional — far better odds for a non-target student,
  # --- and several of these DO have fetchable feeds. Try the discovery tool
  # --- on the tenant guesses in the comments before settling for manual.
  - name: Raymond James
    kind: bank
    source: manual
    url: https://www.raymondjames.com/careers/campus-recruiting
    roles:
      - title: Summer Internship Program
        level: Internship
        bucket: Investment Banking & Markets
        location: St. Petersburg, FL
        cycle: "Opens ~Aug-Oct"
        note: Florida headquarters. Realistically the strongest IB target on this list for a UWF student.

  # try discovery: stifel  piper  bairdcareers  jefferies  hlhz
  - name: Stifel
    kind: bank
    source: manual
    url: https://www.stifel.com/careers/campus-recruiting
