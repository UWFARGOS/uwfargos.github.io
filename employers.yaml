# Employer list — this file IS the product. Curation is what makes the board
# better than a generic search, so keep it deliberate and keep it small.
#
# IMPORTANT, READ ONCE: the tokens and careers URLs below are seeds, not
# verified facts. ATS slugs change and some employers move platforms. Run
#
#     python scripts/verify.py
#
# before your first real fetch. It reports which entries resolve and which
# need fixing, and prints how to find the right value for the broken ones.
#
# kind: accounting | bank | corporate | wealth | insurance | government | other
#   `accounting` matters — it tells the filter that "Associate" is an
#   entry-level campus title rather than a post-MBA hire.
#
# US ONLY: the filter drops non-US postings, but it's far cheaper to not fetch
# them in the first place. Several large firms run ONE global Workday tenant,
# so a global careers_url pulls Toronto, London and Bangalore reqs you then
# throw away. Where a firm has a US-specific career site, point at that — look
# for "US", "Americas", or "Campus" in the site path. The `search` field also
# helps: it is passed to Workday as a keyword query.

#
# STATUS AS OF YOUR LAST RUN: only Regions Bank is confirmed working. Every
# other Workday entry below returned 404 or 422 and is COMMENTED OUT until you
# resolve it. This is deliberate — a list of sixteen broken employers produces
# a red run log every six hours and tells you nothing.
#
# To add one back: run the "Find Workday URL" workflow with a tenant guess,
# paste the URL it prints, and uncomment the entry.
#
